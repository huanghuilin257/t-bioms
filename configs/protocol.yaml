
seed: 66

n_jobs: 8
omp_num_threads: 1

features:
  morgan_radius: 2
  morgan_bits: 2048
  morgan_chirality: true
  descriptors:
    - MolWt
    - MolLogP
    - TPSA
    - NumHDonors
    - NumHAcceptors
    - NumRotatableBonds
    - RingCount
    - HeavyAtomCount
    - FractionCSP3

protocols:

  random_holdout:
    test_size: 0.2
    seeds: [66, 67, 68]

  scaffold_cv:
    n_splits: 5
    shuffle: true

  temporal:
    default_cutpoints: [2015, 2016, 2017, 2018, 2019, 2020, 2021]
    min_train: 100
    min_test: 20

models:
  lightgbm:
    n_estimators: 500
    learning_rate: 0.03
    num_leaves: 31
    min_child_samples: 20
    subsample: 0.9
    colsample_bytree: 0.8
    reg_lambda: 0.01
  hgb:
    max_iter: 300
    learning_rate: 0.04
    max_leaf_nodes: 31
    l2_regularization: 0.01
  rf:
    n_estimators: 400
    max_features: sqrt
    min_samples_leaf: 2
  extratrees:
    n_estimators: 500
    max_features: sqrt
    min_samples_leaf: 2
  ridge:
    alpha: 10.0
  svr:
    kernel: rbf
    C: 10.0
    gamma: scale
    epsilon: 0.1
  knn:
    n_neighbors: 5
    weights: distance

metrics:
  primary: spearman
  also: [pearson, rmse]
  enrichment_pct: [5, 10]

bootstrap:
  n_boot: 2000
  ci: 0.95

applicability_domain:
  fp_radius: 2
  fp_bits: 2048
  fp_chirality: false
  buckets: [[0.0, 0.4], [0.4, 0.6], [0.6, 1.01]]
  min_bucket_n: 5
  min_report_n: 100
